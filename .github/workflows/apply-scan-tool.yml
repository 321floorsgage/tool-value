name: Apply Scan Tool update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scan-tool-reviewed.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          cp scan-tool-reviewed.txt /tmp/scan-tool-reviewed.patch
          git apply --check /tmp/scan-tool-reviewed.patch
          git rm scan-tool-reviewed.txt
          git apply --index /tmp/scan-tool-reviewed.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add single-tool photo scan MVP"
          git push
